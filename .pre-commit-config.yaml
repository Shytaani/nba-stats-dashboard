repos:
-   repo: https://github.com/PyCQA/flake8
    rev: '7.0.0'
    hooks:
    -   id: flake8
        args:
          - --config=.flake8
-   repo: https://github.com/psf/black
    rev: '24.4.2'
    hooks:
    -   id: black
        args:
          - --config=pyproject.toml
-   repo: https://github.com/PyCQA/isort
    rev: '5.13.2'
    hooks:
    -   id: isort
        args:
          - --profile=black
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v1.13.0'
    hooks:
    -   id: mypy
-   repo: local
    hooks:
    -   id: commit-msg
        name: Commit Message Validator
        entry: python git-hooks/commit-msg.py
        language: python
        stages: [commit-msg]